name: Storage safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run storage:schema
      - run: git diff --exit-code -- src/lib/workspace-schema.json
      - run: npm run test:storage
      - run: npm run lint
      - run: npm run build
      - run: npm run test:storage:http
