# Render Blueprint — deploy AR FARM JAYA WMS with a shared Postgres database.
# In Render: New + -> Blueprint -> pick this repo -> Apply.
# It creates the web service and the database, and wires DATABASE_URL for you.
services:
  - type: web
    name: arfarmjaya
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run start
    healthCheckPath: /api/state
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arfarmjaya-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

databases:
  - name: arfarmjaya-db
    plan: free
    region: singapore
